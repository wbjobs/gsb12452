<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>普通弹窗（画中画降级）</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0f1420; color: #e8edf6;
      font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { display: flex; flex-direction: column; height: 100%; }
    .bar {
      padding: 8px 12px; background: #1f2839;
      border-bottom: 1px solid #2b364c;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .bar strong { color: #f5a623; }
    canvas { flex: 1; width: 100%; background: #000; display: block; }
    .hint { color: #9aa7bd; font-size: 12px; }
    button {
      background: #4f8cff; color: #fff; border: none; border-radius: 6px;
      padding: 5px 10px; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span><strong>降级方案：</strong>普通弹窗模拟画中画</span>
      <span class="hint">
        <button id="popout" type="button">窗口置顶提示</button>
        <button id="close" type="button">关闭</button>
      </span>
    </div>
    <canvas id="c" width="480" height="270"></canvas>
  </div>
  <script>
    // 与主页相同的本地 canvas 动画，不依赖任何资源
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.height = Math.round(canvas.width * 9 / 16);
    }
    window.addEventListener('resize', resize);
    resize();

    function draw(ts) {
      const W = canvas.width, H = canvas.height;
      const t = ts / 1000;
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#16233d');
      g.addColorStop(1, '#0d3a4a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      const x = W / 2 + Math.cos(t * 1.4) * (W * 0.28);
      const y = H / 2 + Math.sin(t * 1.4) * (H * 0.22);
      ctx.beginPath();
      ctx.arc(x, y, Math.max(18, H * 0.1), 0, Math.PI * 2);
      ctx.fillStyle = '#4f8cff';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = '600 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('普通弹窗（PiP 降级）', W / 2, 34);
      ctx.font = '500 24px ui-monospace, Menlo, monospace';
      ctx.fillText(new Date().toLocaleTimeString(), W / 2, H - 22);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    document.getElementById('close').onclick = () => window.close();
    document.getElementById('popout').onclick = () => {
      alert('这是普通浏览器窗口。\n你可以拖动它到屏幕角落，模拟画中画的悬浮效果。');
    };
  </script>
</body>
</html>
